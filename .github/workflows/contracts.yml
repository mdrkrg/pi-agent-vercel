name: durability contracts

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: poc
          POSTGRES_PASSWORD: poc
          POSTGRES_DB: poc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poc -d poc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm docs:check
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://poc:poc@127.0.0.1:5432/poc
